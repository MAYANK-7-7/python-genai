[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vps-mcp"
version = "0.1.0"
description = "MCP server that connects Claude (or any MCP client) directly to a VPS over SSH/SFTP."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3.0",
    "asyncssh>=2.14,<3.0",
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
vps-mcp = "vps_mcp.server:main"

[tool.setuptools.packages.find]
include = ["vps_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
